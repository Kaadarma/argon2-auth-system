<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth Argon2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #18181b;
    --border: #2a2a2e;
    --border-focus: #5b5bd6;
    --text: #ededef;
    --text-muted: #8b8b8f;
    --accent: #5b5bd6;
    --accent-hover: #6e6ade;
    --success: #30a46c;
    --error: #e5484d;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Dot grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, #2a2a2e 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.5;
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    padding: 40px;
    position: relative;
    animation: fadeUp .4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: .08em;
    margin-bottom: 28px;
  }

  .logo span { color: var(--text-muted); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 32px;
  }

  .tab {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }

  .tab.active {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* Form */
  .form { display: none; flex-direction: column; gap: 16px; }
  .form.active { display: flex; animation: fadeUp .3s ease both; }

  label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: .05em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }

  input:focus { border-color: var(--border-focus); }
  input::placeholder { color: var(--text-muted); opacity: .5; }

  .btn {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .2s, transform .1s;
    margin-top: 4px;
  }

  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Alert */
  .alert {
    display: none;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-family: var(--mono);
    line-height: 1.5;
  }

  .alert.success { display: block; background: #0d2e1f; color: var(--success); border: 1px solid #1a4731; }
  .alert.error   { display: block; background: #2c1215; color: var(--error);   border: 1px solid #481a1d; }

  /* Dashboard */
  #dashboard { display: none; flex-direction: column; gap: 20px; }
  #dashboard.active { display: flex; animation: fadeUp .3s ease both; }

  .user-badge {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 500; color: #fff;
    flex-shrink: 0;
  }

  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 14px; font-weight: 500; }
  .user-sub  { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

  .token-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .token-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 6px;
  }

  .token-value {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    word-break: break-all;
    line-height: 1.6;
  }

  .btn-logout {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }

  .btn-logout:hover { border-color: var(--error); color: var(--error); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">argon2id<span>://auth</span></div>

  <!-- Auth Forms -->
  <div id="auth-section">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login -->
    <form class="form active" id="form-login" onsubmit="doLogin(event)">
      <div>
        <label>Username</label>
        <input type="text" id="login-username" placeholder="masukkan username" autocomplete="username">
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="login-password" placeholder="masukkan password" autocomplete="current-password">
      </div>
      <div id="login-alert" class="alert"></div>
      <button type="submit" class="btn" id="login-btn">Masuk</button>
    </form>

    <!-- Register -->
    <form class="form" id="form-register" onsubmit="doRegister(event)">
      <div>
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="minimal 3 karakter">
      </div>
      <div>
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="email@contoh.com">
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="min 8 kar, huruf kapital, angka, spesial">
      </div>
      <div id="reg-alert" class="alert"></div>
      <button type="submit" class="btn" id="reg-btn">Daftar</button>
    </form>
  </div>

  <!-- Dashboard setelah login -->
  <div id="dashboard">
    <div class="user-badge">
      <div class="avatar" id="avatar-letter">B</div>
      <div class="user-info">
        <div class="user-name" id="dash-username">budi</div>
        <div class="user-sub">login berhasil</div>
      </div>
    </div>
    <div class="token-box">
      <div class="token-label">Access Token</div>
      <div class="token-value" id="dash-token">—</div>
    </div>
    <div id="dash-alert" class="alert"></div>
    <button class="btn-logout" onclick="doLogout()">Keluar</button>
  </div>
</div>

<script>
  const API = 'http://127.0.0.1:5000';
  let refreshToken = null;

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (tab === 'login' ? i === 0 : i === 1));
    });
    document.getElementById('form-login').classList.toggle('active', tab === 'login');
    document.getElementById('form-register').classList.toggle('active', tab === 'register');
    clearAlerts();
  }

  function clearAlerts() {
    ['login-alert','reg-alert','dash-alert'].forEach(id => {
      const el = document.getElementById(id);
      el.className = 'alert';
      el.textContent = '';
    });
  }

  function showAlert(id, msg, type) {
    const el = document.getElementById(id);
    el.className = 'alert ' + type;
    el.textContent = msg;
  }

  async function doRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');
    btn.disabled = true;
    btn.textContent = 'Mendaftar...';

    const body = {
      username: document.getElementById('reg-username').value,
      email:    document.getElementById('reg-email').value,
      password: document.getElementById('reg-password').value,
    };

    try {
      const res  = await fetch(`${API}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (data.success) {
        showAlert('reg-alert', '✓ ' + data.message + ' Silakan login.', 'success');
        setTimeout(() => switchTab('login'), 1500);
      } else {
        showAlert('reg-alert', data.message, 'error');
      }
    } catch {
      showAlert('reg-alert', 'Tidak bisa terhubung ke server.', 'error');
    }

    btn.disabled = false;
    btn.textContent = 'Daftar';
  }

  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Masuk...';

    const body = {
      username: document.getElementById('login-username').value,
      password: document.getElementById('login-password').value,
    };

    try {
      const res  = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (data.success) {
        refreshToken = data.refresh_token;
        showDashboard(body.username, data.access_token);
      } else {
        showAlert('login-alert', data.message, 'error');
      }
    } catch {
      showAlert('login-alert', 'Tidak bisa terhubung ke server.', 'error');
    }

    btn.disabled = false;
    btn.textContent = 'Masuk';
  }

  function showDashboard(username, accessToken) {
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('dash-username').textContent = username;
    document.getElementById('avatar-letter').textContent = username[0].toUpperCase();
    document.getElementById('dash-token').textContent = accessToken;
  }

  async function doLogout() {
    try {
      await fetch(`${API}/logout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
    } catch {}

    refreshToken = null;
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('auth-section').style.display = 'block';
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';
    clearAlerts();
  }
</script>
</body>
</html>
